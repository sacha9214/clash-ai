# Tests à chaque push sur main et sur chaque PR : cerveau, adversaire, bandit, détecteurs, boucle (sans téléphone ni GPU)
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # relance à la main (onglet Actions)
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Dépendances
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt
      - name: Tests
        env:
          YOLO_OFFLINE: "1"
        run: python -m pytest -q tests
